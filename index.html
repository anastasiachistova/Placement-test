<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Level Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    max-width: 800px;
    margin: 30px auto;
    padding: 20px;
    background: #f4f6f8;
    color: #222;
  }
  h1 { text-align: center; }
  .question {
    background: #fff;
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
  }
  .question p { font-weight: bold; margin: 0 0 8px; }
  label { display: block; margin: 4px 0; cursor: pointer; }
  button {
    display: block;
    margin: 24px auto;
    padding: 12px 36px;
    font-size: 16px;
    background: #2b7cff;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button:hover { background: #1a5fd0; }
  #result {
    text-align: center;
    font-size: 22px;
    font-weight: bold;
    margin-top: 24px;
    padding: 16px;
    background: #fff;
    border-radius: 8px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
  }
  .correct { color: #1a8f3c; }
  .wrong { color: #c0392b; }
</style>
</head>
<body>

<h1>English Level Test</h1>
<form id="quizForm"></form>
<button type="button" onclick="checkQuiz()">Проверить результат</button>
<div id="result"></div>

<script>
const questions = [
  { q: "____ you interested in sport?", options: ["Be", "Am", "Is", "Are"], correct: 3 },
  { q: "My ____ is a writer and his books are very popular.", options: ["aunt", "uncle", "sister", "mother"], correct: 1 },
  { q: "Paul is very ____. He’s very good at art.", options: ["honest", "friendly", "polite", "creative"], correct: 3 },
  { q: "We live in the city centre and our house ____ have a big garden.", options: ["doesn’t", "isn’t", "aren’t", "don’t"], correct: 3 },
  { q: "I ____ arrive at school before nine o’clock.", options: ["has to", "have to", "doesn’t have to", "haven’t to"], correct: 1 },
  { q: "The beach was very crowded ____ Monday.", options: ["in", "on", "at", "to"], correct: 1 },
  { q: "You ____ eat all that cake! It isn’t good for you.", options: ["don’t", "may not", "shouldn’t", "will not"], correct: 2 },
  { q: "Cathy ____ a game on her computer at the moment.", options: ["plays", "is playing", "to play", "play"], correct: 1 },
  { q: "There ____ a lot of people outside the school. What’s the problem?", options: ["are", "is", "be", "am"], correct: 0 },
  { q: "____ you like to come out with us tonight?", options: ["Do", "Would", "Are", "Will"], correct: 1 },
  { q: "How ____ time have we got to do this exercise?", options: ["long", "many", "much", "quick"], correct: 2 },
  { q: "Turn ____ and you’ll see the museum on the left.", options: ["on the right", "rightly", "by the right", "right"], correct: 3 },
  { q: "Tom got the ____ marks in the class for his homework.", options: ["worse", "worst", "baddest", "most bad"], correct: 1 },
  { q: "There wasn’t ____ milk for breakfast this morning so I had toast and orange juice.", options: ["a", "some", "the", "any"], correct: 3 },
  { q: "My sister ____ speak French when she was only six years old.", options: ["was", "should", "could", "had"], correct: 2 },
  { q: "Did you ____ shopping after school yesterday?", options: ["went", "goed", "going", "go"], correct: 3 },
  { q: "I ____ five emails before school today.", options: ["sent", "sended", "did send", "was send"], correct: 0 },
  { q: "Our teacher speaks English to us ____ so that we can understand her.", options: ["slow", "slower", "more slow", "slowly"], correct: 3 },
  { q: "My father has been a pilot ____ twenty years and he still loves his job.", options: ["since", "for", "until", "by"], correct: 1 },
  { q: "I ____ the new Batman film yet. Is it any good?", options: ["haven’t seen", "didn’t see", "don’t see", "am not seen"], correct: 0 },
  { q: "I hope you ____ a good time at the moment in Greece! Phone soon.", options: ["are having", "have", "have had", "had"], correct: 0 },
  { q: "I wanted to see Harry. How long ago ____ ?", options: ["he left", "has he left", "did he leave", "could he leave"], correct: 2 },
  { q: "I ____ you in the café at about 4.30 and we can discuss our plans then, OK?", options: ["’ll see", "am going to see", "am seeing", "see"], correct: 0 },
  { q: "Which train ____ for when I saw you on the platform on Sunday?", options: ["did you wait", "were you waiting", "have you waited", "are you waiting"], correct: 1 },
  { q: "That car is ____ dangerous to drive.", options: ["too", "enough", "not enough", "the worst"], correct: 0 },
  { q: "Look out for a petrol station because I think we’re going to run ____ of petrol soon.", options: ["down", "out", "off", "through"], correct: 1 },
  { q: "Could I possibly ____ some money for the bus fare home? I’ve lost my bag.", options: ["lend", "owe", "borrow", "need"], correct: 2 },
  { q: "If we ____ in the countryside, we’d have much better views than we do now.", options: ["lived", "were live", "would live", "live"], correct: 0 },
  { q: "I wish Joe ____ to Hawaii on holiday. They’re talking about an eruption there on the news.", options: ["doesn’t go", "didn’t go", "hasn’t gone", "hadn’t gone"], correct: 3 },
  { q: "Sam asked me if I ____ a lift home after the concert.", options: ["had wanted", "wanted", "would want", "want"], correct: 1 },
  { q: "People say that an avalanche ____ by loud noises in the area but I don’t know if that’s true.", options: ["causes", "has caused", "is causing", "is caused"], correct: 3 },
  { q: "It was great to see you at the party. I didn’t realize how long ____ since we last met.", options: ["it had been", "it was been", "it was being", "it is been"], correct: 0 },
  { q: "That’s the office ____ my dad works.", options: ["who", "where", "that", "which"], correct: 1 },
  { q: "Look at the news! Three cars ____ in a bad accident on the motorway at Dartford.", options: ["are involving", "involve", "have involved", "have been involved"], correct: 3 },
  { q: "You should be very proud ____ what you’ve achieved over the last year.", options: ["of", "on", "to", "for"], correct: 0 },
  { q: "By the time I hand in this project, I ____ on it for three weeks!", options: ["’ll be working", "’ll have been working", "have worked", "’ll work"], correct: 1 },
  { q: "If I’d gone to the sales yesterday, I ____ one of those cheap bags before they sold out.", options: ["could have bought", "had bought", "would buy", "bought"], correct: 0 },
  { q: "I must remember ____ Ed to take notes for me while I’m away next week.", options: ["ask", "to ask", "asking", "for asking"], correct: 1 }
];

// Рендер формы
const form = document.getElementById('quizForm');
questions.forEach((item, i) => {
  const div = document.createElement('div');
  div.className = 'question';
  let html = `<p>${i + 1}. ${item.q}</p>`;
  item.options.forEach((opt, j) => {
    html += `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`;
  });
  div.innerHTML = html;
  form.appendChild(div);
});

function getLevel(score) {
  if (score <= 7)  return 'Elementary — Среда 9:50';
  if (score <= 15) return 'Pre-Intermediate — Среда 10:40';
  if (score <= 24) return 'Intermediate 1 — Понедельник 10:40';
  if (score <= 31) return 'Intermediate 2 — Понедельник 9:50';
  return 'Upper-Intermediate — Понедельник 9:00';
}

function checkQuiz() {
  const total = questions.length;
  let score = 0;
  let unanswered = false;

  questions.forEach((item, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    if (!selected) { unanswered = true; return; }
    if (parseInt(selected.value) === item.correct) score++;
  });

  const resultEl = document.getElementById('result');

  if (unanswered) {
    resultEl.innerHTML = '<span class="wrong">Ответьте на все вопросы!</span>';
    return;
  }

  const level = getLevel(score);
  resultEl.innerHTML = `
    Правильных ответов: <span class="correct">${score}</span> из ${total}<br>
    Ваш уровень: <span class="correct">${level}</span>
  `;
}
</script>

</body>
</html>
